<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · Hostal Prada</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .error-page{
    min-height: 100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background: linear-gradient(180deg, #0c0d13 0%, var(--ink) 55%, #23140f 100%);
    color: var(--cream-text);
    padding: 2rem 1.5rem;
    gap: 1.2rem;
  }
  .error-code{
    font-family: var(--font-display);
    font-size: clamp(5rem, 22vw, 11rem);
    line-height:.9;
    color: var(--cream-text);
    text-shadow:
      0 0 6px rgba(244,180,0,.55),
      0 0 22px rgba(224,64,43,.45),
      0 0 46px rgba(224,64,43,.25);
  }
  .error-title{
    font-family: var(--font-display);
    font-size: clamp(1.4rem, 4vw, 2rem);
    letter-spacing:.01em;
  }
  .error-text{
    max-width: 30rem;
    color: rgba(247,241,226,.75);
    font-size: 1rem;
  }
  .error-text.en{ font-size:.9rem; color: rgba(247,241,226,.55); }
  .error-actions{ display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; margin-top:.6rem; }
</style>
</head>
<body>
<section class="error-page">
  <span class="error-code">404</span>
  <h1 class="error-title">Esta página se ha ido de paseo por la Gran Vía</h1>
  <p class="error-text">La página que buscas no existe o se ha movido. Vuelve al inicio y desde ahí encontrarás todo lo que necesites.</p>
  <p class="error-text en">This page does not exist or has moved. Head back to the homepage to find what you need.</p>
  <div class="error-actions">
    <a class="btn btn-neon" href="/">Volver al inicio</a>
    <a class="btn btn-outline" href="/#contacto">Contactar</a>
  </div>
</section>
</body>
</html>
